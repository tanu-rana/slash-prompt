<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slash Prompt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <h1 class="app-title">Prompt Manager</h1>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v6m0 6v6m4.22-13.22l4.24 4.24M18.36 18.36l4.24 4.24M23 12h-6m-6 0H1m4.22 4.22l-4.24 4.24M5.64 5.64L1.4 1.4"></path>
          </svg>
        </button>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search prompts..." autocomplete="off">
      <div id="tagFilter" class="tag-filter"></div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button id="addPromptBtn" class="action-btn primary">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New Prompt</span>
      </button>
      <button id="manageBtn" class="action-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18m-9-9v18"></path>
        </svg>
        <span>Manage</span>
      </button>

    <!-- Prompts List -->
    <div class="prompts-container">
      <div id="promptsList" class="prompts-list">
        <!-- Prompts will be dynamically inserted here -->
      </div>
      
      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <p class="empty-title">No prompts yet</p>
        <p class="empty-subtitle">Create your first prompt to get started</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-stats">
        <span id="promptCount">0 prompts</span>
      </div>
      <div class="footer-actions">
        <button id="importBtn" class="text-btn">Import</button>
        <button id="exportBtn" class="text-btn">Export</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Prompt Modal -->
  <div id="promptModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Prompt</h2>
        <button id="closeModal" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label for="promptTitle">Title</label>
          <input type="text" id="promptTitle" class="form-input" placeholder="Enter prompt title...">
        </div>
        
        <div class="form-group">
          <label for="promptContent">Content</label>
          <textarea id="promptContent" class="form-textarea" placeholder="Enter your prompt..." rows="6"></textarea>
        </div>
        
        <div class="form-group">
          <label for="promptTags">Tags</label>
          <div id="tagSelector" class="tag-selector">
            <!-- Tags will be dynamically inserted -->
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button id="cancelBtn" class="action-btn">Cancel</button>
        <button id="savePromptBtn" class="action-btn primary">Save Prompt</button>
      </div>
    </div>
  </div>

  <!-- Import Modal -->
  <div id="importModal" class="modal" style="display: none;">
    <div class="modal-content small">
      <div class="modal-header">
        <h2>Import Prompts</h2>
        <button id="closeImportModal" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="modal-body">
        <div class="import-zone" id="importZone">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <p>Drop JSON file here or click to browse</p>
          <input type="file" id="fileInput" accept=".json" style="display: none;">
        </div>
        
        <div class="form-group" style="margin-top: 16px;">
          <label>
            <input type="checkbox" id="overwriteCheck">
            <span>Overwrite existing prompts with same title</span>
          </label>
        </div>
      </div>
      
      <div class="modal-footer">
        <button id="cancelImportBtn" class="action-btn">Cancel</button>
        <button id="confirmImportBtn" class="action-btn primary" disabled>Import</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
