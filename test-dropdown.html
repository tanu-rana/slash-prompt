<!DOCTYPE html>
<html>
<head>
  <title>Dropdown Test</title>
  <style>
    body { padding: 20px; font-family: Arial; }
    select { padding: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Testing File Format Dropdown</h1>
  <p>This is a direct copy from options.html:</p>
  
  <select id="fileFormatSelect" class="setting-select">
    <option value="json">JSON (.json)</option>
    <option value="txt">Plain Text (.txt)</option>
    <option value="md" selected>Markdown (.md)</option>
    <option value="xml">XML (.xml)</option>
  </select>

  <p>You should see 4 options above, including XML.</p>
</body>
</html>
